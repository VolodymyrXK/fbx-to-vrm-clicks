[plugin]
id = "fbx-to-vrm-clicks"
name = "FBX to VRM in a couple of clicks"
version = "1.2.0"
description = "Turns MMD (.pmx/.pmd) and FBX character models into VRM avatars, saved next to the original. For more precise tuning, use the built-in editor."
author = "VovaBOOMs"
call_timeout_secs = 900

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python"]

[capabilities]
tools = true

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]

[permissions]

[config]
schema = "{\"type\": \"object\", \"properties\": {\"vrm_version\": {\"type\": \"string\", \"enum\": [\"VRM 0.x\", \"VRM 1.0\"], \"default\": \"VRM 0.x\", \"title\": \"Версия VRM\"}, \"output_folder\": {\"type\": \"string\", \"default\": \"\", \"title\": \"Папка для готовых VRM (пусто — рядом с моделью)\"}, \"physics\": {\"type\": \"string\", \"enum\": [\"Плавный (стрим, VTuber)\", \"Аниме\", \"Реалистичный\", \"Жёсткий\", \"Динамичный (танцы)\", \"Тяжёлый (длинные волосы, плащи)\", \"Как в MMD\"], \"default\": \"Плавный (стрим, VTuber)\", \"title\": \"Физика волос и одежды («Плавный» — лучше всего для Astra)\"}, \"best_textures\": {\"type\": \"boolean\", \"default\": false, \"title\": \"Максимальное качество текстур (PNG, до 4096 px)\"}, \"max_mb\": {\"type\": \"number\", \"default\": 0, \"minimum\": 0, \"title\": \"Максимальный размер файла, МБ (0 — без ограничения)\"}, \"ru_names\": {\"type\": \"boolean\", \"default\": false, \"title\": \"Русские названия выражений и частей\"}}}"
