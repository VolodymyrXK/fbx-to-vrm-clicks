[plugin]
id = "fbx-to-vrm-clicks"
name = "FBX to VRM in a couple of clicks"
version = "1.3.0"
description = "Turns MMD (.pmx/.pmd) and FBX character models into VRM avatars, saved next to the original. For more precise tuning, use the built-in editor."
author = "VovaBOOMs"
call_timeout_secs = 900

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python"]

[capabilities]
tools = true

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]

[permissions]

[config]
schema = "{\"type\": \"object\", \"properties\": {\"language\": {\"type\": \"string\", \"enum\": [\"$config.language.auto\", \"$config.language.ru\", \"$config.language.en\"], \"default\": \"$config.language.auto\", \"title\": \"$config.language.title\"}, \"vrm_version\": {\"type\": \"string\", \"enum\": [\"VRM 0.x\", \"VRM 1.0\"], \"default\": \"VRM 0.x\", \"title\": \"$config.vrm_version.title\"}, \"output_folder\": {\"type\": \"string\", \"default\": \"\", \"title\": \"$config.output_folder.title\"}, \"physics\": {\"type\": \"string\", \"enum\": [\"$config.physics.soft\", \"$config.physics.anime\", \"$config.physics.realistic\", \"$config.physics.stiff\", \"$config.physics.dance\", \"$config.physics.heavy\", \"$config.physics.mmd\"], \"default\": \"$config.physics.soft\", \"title\": \"$config.physics.title\"}, \"best_textures\": {\"type\": \"boolean\", \"default\": false, \"title\": \"$config.best_textures.title\"}, \"max_mb\": {\"type\": \"number\", \"default\": 0, \"minimum\": 0, \"title\": \"$config.max_mb.title\"}, \"ru_names\": {\"type\": \"boolean\", \"default\": false, \"title\": \"$config.ru_names.title\"}}}"
